name = "r2-webdav"
main = "src/index.ts"
compatibility_date = "2023-10-16"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
routes = [{ pattern = "r.rei8t.dev", custom_domain = true }]

[[r2_buckets]]
binding = "bucket"
bucket_name = "r2-webdav"

[observability]
enabled = true
head_sampling_rate = 1

# 浏览器文件管理页（dist-web/index.html）作为字符串内联进脚本
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = false
